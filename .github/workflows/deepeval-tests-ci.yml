name: DeepEval Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'deepeval-tests/**'
      - 'llm-multiroute/**'
      - '.github/workflows/deepeval-tests-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'deepeval-tests/**'
      - 'llm-multiroute/**'
      - '.github/workflows/deepeval-tests-ci.yml'
  workflow_dispatch:

env:
  # Shared by the backend and the DeepEval judge (read by conftest.py)
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
  # Judge model: must exist on the server at OLLAMA_BASE_URL
  JUDGE_MODEL: llama3.2

jobs:
  deepeval:
    name: DeepEval LLM Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: deepeval-tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deepeval-tests/requirements.txt

      - name: Check judge server is reachable
        run: |
          if [ -z "$OLLAMA_BASE_URL" ]; then
            echo "OLLAMA_BASE_URL secret is not set."
            exit 1
          fi
          BASE="${OLLAMA_BASE_URL%/}"
          BASE="${BASE%/v1}"
          curl -sf -H "Authorization: Bearer ${OLLAMA_API_KEY:-ollama}" \
            "$BASE/v1/models" > /dev/null \
            && echo "Judge server is reachable." \
            || { echo "Cannot reach Ollama at OLLAMA_BASE_URL."; exit 1; }

      - name: Build and start backend
        run: docker compose up -d llm-multiroute

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/api/ai/routes > /dev/null 2>&1; then
              echo "Backend is ready."
              exit 0
            fi
            echo "Attempt $i/30 - backend not ready yet..."
            sleep 5
          done
          echo "Backend failed to start."
          docker compose logs llm-multiroute
          exit 1

      - name: Run DeepEval classify tests
        working-directory: deepeval-tests
        run: deepeval test run test_classify.py -v

      - name: Run DeepEval sentiment tests
        if: success() || failure()
        working-directory: deepeval-tests
        run: deepeval test run test_sentiment.py -v

      - name: Run DeepEval summarize tests
        if: success() || failure()
        working-directory: deepeval-tests
        run: deepeval test run test_summarize.py -v

      - name: Run DeepEval intent tests
        if: success() || failure()
        working-directory: deepeval-tests
        run: deepeval test run test_intent.py -v

      - name: Tear down backend
        if: always()
        run: docker compose down